name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Node 20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: node ./src/main.mjs --version
      - run: node ./src/main.mjs --help
      - if: runner.os != 'Linux'
        run: node ./test/platform-secure-store-smoke.mjs
      - run: npm pack --dry-run
