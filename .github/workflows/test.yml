name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}${{ matrix.node == '20.19.5' && ' (legacy compatibility only)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is retained for legacy compatibility, not production security.
        node: ["20.19.5", "22.23.4", "24.22.1"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - run: node ./src/main.mjs --version
      - run: node ./src/main.mjs --help
      - if: runner.os != 'Linux'
        run: node ./test/platform-secure-store-smoke.mjs
      - run: npm pack --dry-run

  test:
    name: test
    needs: platform
    runs-on: ubuntu-latest
    steps:
      - run: echo "All platform checks passed."
